[package]
name = "keepsave-core"
description = "Vault model, KDBX4 I/O and password generator for KeepSave"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
keepass = { version = "0.17", features = ["save_kdbx4", "_merge"] }
chrono = "0.4"
rust-argon2 = "3"
rand = "0.10"
secrecy = "0.10"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
