[package]
name = "keepsave-sync"
description = "Google Drive sync for KeepSave"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
base64 = "0.23"
chrono = "0.4"
keepsave-core.workspace = true
keyring = "4"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "query", "form"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = { version = "0.10", features = ["serde"] }
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "sync", "macros", "rt"] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util"] }
